[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cae_hydro_prop"
dynamic = ["version"]
description = "hydro_prop calculations"
authors = [{ name = "Wolfgang Schnell", email = "wolfgang.schnell@schnell-dsr.de" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    'numpy>=1.20',
    'typing_extensions; python_version <= "3.7"',
]

[project.optional-dependencies]
testing = [
]

[tool.setuptools.dynamic]
version = {attr = "hydro_prop.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["hydro_prop*"]
exclude = ["testing*"]

[tool.black]
line-length = 144

[tool.ruff]
select = ["E", "F", "I", "N", "ERA", "NPY", "PL", "FLY", "RUF"]
ignore = [
    #"RUF100",   # "unused noqa statements"
    #"PLR0911",  # "too many return statements"
    #"PLR0912",  # "too many branches"
    #"PLR0913",  # "too many arguments to function call"
    #"PLR0915",  # "too many statements in one function"
    #"PLW0603",  # "use of global statement to update identifiers"
    #"N999",  # "invalid module name (not snake_case)"
]
target-version = "py312"
line-length = 144
exclude = [
]

[tool.ruff.per-file-ignores]
#"__init__.py" = ["F401"]

[tool.pyright]
typeCheckingMode = "strict"
strict = ["*"]
pythonVersion = "3.12"
reportMissingModuleSource = false
ignore = [
]
pythonPlatform = "Linux"

[tool.pylint]
max-complexity = 25
